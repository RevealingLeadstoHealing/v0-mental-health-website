AWSTemplateFormatVersion: "2010-09-09"
Description: RLTH EHR least-privilege IAM user for Vercel server runtime access.

Parameters:
  PracticeSlug:
    Type: String
    Default: rlth
    AllowedPattern: "^[a-z0-9-]+$"
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
      - dev
  KmsKeyArn:
    Type: String
  CognitoUserPoolId:
    Type: String
  ClinicalRecordsTableName:
    Type: String
  AuditEventsTableName:
    Type: String
  DocumentMetadataTableName:
    Type: String
  DocumentsBucketName:
    Type: String
  SesFromAddress:
    Type: String
    Default: "no-reply@revealing-leads-to-healing-wellness-services.org"
    Description: Verified SES sender address the Vercel runtime is allowed to send from.
  SesIdentityArn:
    Type: String
    Default: ""
    Description: >
      ARN of the verified SES domain or email identity. Leave empty to skip
      the SES send policy (Cognito will handle email directly in that case).

Conditions:
  HasSesIdentity: !Not [!Equals [!Ref SesIdentityArn, ""]]

Resources:
  VercelRuntimeUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${PracticeSlug}-${EnvironmentName}-vercel-ehr-runtime"
      Tags:
        - Key: Application
          Value: RLTH-EHR
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: VercelRuntime

  VercelRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${PracticeSlug}-${EnvironmentName}-vercel-ehr-runtime-policy"
      Users:
        - !Ref VercelRuntimeUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DynamoClinicalRecordsAccess
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClinicalRecordsTableName}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClinicalRecordsTableName}/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditEventsTableName}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuditEventsTableName}/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentMetadataTableName}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentMetadataTableName}/index/*"
          - Sid: PrivateDocumentBucketAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${DocumentsBucketName}/ehr-documents/*"
          - Sid: PrivateDocumentBucketList
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${DocumentsBucketName}"
            Condition:
              StringLike:
                s3:prefix:
                  - "ehr-documents/*"
          - Sid: EHRKmsUse
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: !Ref KmsKeyArn
          - Sid: CognitoUserPoolReadAndAdmin
            Effect: Allow
            Action:
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminRemoveUserFromGroup
              - cognito-idp:AdminUpdateUserAttributes
              - cognito-idp:ListUsers
            Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  # Conditionally attach SES send permissions when a verified identity is configured.
  # This policy is only created when SesIdentityArn is non-empty.
  VercelSesPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSesIdentity
    Properties:
      PolicyName: !Sub "${PracticeSlug}-${EnvironmentName}-vercel-ehr-ses-policy"
      Users:
        - !Ref VercelRuntimeUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesTransactionalEmailSend
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource:
              - !Ref SesIdentityArn
            Condition:
              StringEquals:
                # Restrict to the specific from-address configured for this EHR deployment.
                ses:FromAddress: !Ref SesFromAddress
          - Sid: SesGetSendQuota
            Effect: Allow
            Action:
              - ses:GetSendQuota
              - ses:GetSendStatistics
            Resource: "*"

Outputs:
  RuntimeUserName:
    Description: IAM user name for the Vercel EHR server runtime.
    Value: !Ref VercelRuntimeUser
  RuntimePolicyName:
    Description: IAM policy attached to the Vercel EHR runtime user (DynamoDB, S3, KMS, Cognito).
    Value: !Ref VercelRuntimePolicy
  SesPolicyName:
    Description: IAM policy for SES transactional email send (only present when SesIdentityArn is set).
    Value: !If [HasSesIdentity, !Ref VercelSesPolicy, "N/A - SesIdentityArn not provided"]

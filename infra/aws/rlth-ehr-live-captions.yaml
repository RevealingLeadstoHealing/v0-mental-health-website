AWSTemplateFormatVersion: '2010-09-09'
Description: Live caption permissions for the existing EHR Chime rooms.
Parameters:
  AmplifyComputeRoleName:
    Type: String
    Description: Verified existing production SSR compute role name.
  CreateTranscriptionServiceRole:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Set true only after verifying AWSServiceRoleForAmazonChimeTranscription does not already exist.
Conditions:
  NeedsServiceRole: !Equals [!Ref CreateTranscriptionServiceRole, 'true']
Resources:
  LiveCaptionRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: rlth-live-captions-transcription
      Roles: [!Ref AmplifyComputeRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # chime:StartMeetingTranscription / chime:StopMeetingTranscription and
          # transcribe:StartStreamTranscription are wildcard-only actions: the IAM
          # service-authorization reference lists NO resource type for them, so a
          # statement scoped to a meeting/* ARN never matches and produces an
          # implicitDeny (verified with iam simulate-principal-policy). They must be
          # granted on Resource '*'. Scoping is enforced in the app layer, which only
          # ever calls these against rooms it just created for the signed-in provider.
          - Sid: LiveCaptionsTranscription
            Effect: Allow
            Action:
              - chime:StartMeetingTranscription
              - chime:StopMeetingTranscription
              - transcribe:StartStreamTranscription
            Resource: '*'
  TranscriptionServiceRole:
    Type: AWS::IAM::ServiceLinkedRole
    Condition: NeedsServiceRole
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AWSServiceName: transcription.chime.amazonaws.com

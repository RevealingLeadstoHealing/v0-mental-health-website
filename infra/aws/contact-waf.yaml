AWSTemplateFormatVersion: '2010-09-09'
Description: Rate limit public contact form submissions. Associate with the Amplify app separately.
Resources:
  ContactWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: ContactWebAcl
        SampledRequestsEnabled: false
      Rules:
        - Name: ContactPostRateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 100
              EvaluationWindowSec: 300
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/contact
                        TextTransformations:
                          - Priority: 0
                            Type: URL_DECODE
                          - Priority: 1
                            Type: NORMALIZE_PATH
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ContactPostRateLimit
            SampledRequestsEnabled: false
Outputs:
  WebAclArn:
    Value: !GetAtt ContactWebAcl.Arn

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pin pnpm to a stable version that matches lockfileVersion 9.0.
        # Without this, `corepack enable` fetched the latest pnpm (12.3.4),
        # which failed to download in the Amplify build environment and broke
        # every build before it reached the app code.
        - corepack enable
        - corepack prepare pnpm@9.15.9 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        # NEXT_PUBLIC_TURNSTILE_SITE_KEY is public and is embedded in the contact page.
        # TURNSTILE_SECRET_KEY stays server-only: it is read directly from Amplify runtime
        # environment variables and is never written to .env.production or a NEXT_PUBLIC_ variable.
        - test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || (echo "Missing AWS Amplify environment variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY" >&2; exit 1)
        - test -n "$TURNSTILE_SECRET_KEY" || (echo "Missing AWS Amplify environment variable: TURNSTILE_SECRET_KEY" >&2; exit 1)
        - env | grep -E '^(AWS_REGION|EHR_AWS_REGION|EHR_COGNITO_USER_POOL_ID|EHR_COGNITO_CLIENT_ID|EHR_RECORDS_TABLE|EHR_AUDIT_TABLE|EHR_DOCUMENTS_TABLE|EHR_DOCUMENTS_BUCKET|EHR_KMS_KEY_ARN|EHR_CLEARINGHOUSE_SECRET_ARN|EHR_PHI_ENTRY_ALLOWED|EHR_HEALTHSCRIBE_REGION|EHR_HEALTHSCRIBE_BUCKET|EHR_HEALTHSCRIBE_KMS_KEY_ARN|EHR_HEALTHSCRIBE_DATA_ROLE_ARN|EHR_HEALTHSCRIBE_ORCHESTRATOR_ARN|EHR_FAX_BUCKET|EHR_FAX_REGION|EHR_NATIVE_TELEHEALTH_ENABLED|EHR_TELEHEALTH_REGION|NEXT_PUBLIC_TURNSTILE_SITE_KEY|NEXT_PUBLIC_AWS_REGION|NEXT_PUBLIC_COGNITO_USER_POOL_ID|NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID|NEXT_PUBLIC_COGNITO_CLIENT_ID|NEXT_PUBLIC_RLTH_AWS_FOUNDATION_READY)=' > .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

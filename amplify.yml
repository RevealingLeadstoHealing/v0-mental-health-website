version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Only non-secret resource identifiers are exposed to the Next.js SSR runtime.
        # Never add credentials, tokens, passwords, or application secrets here.
        - env | grep -E '^(AWS_REGION|EHR_AWS_REGION|EHR_COGNITO_USER_POOL_ID|EHR_COGNITO_CLIENT_ID|EHR_RECORDS_TABLE|EHR_AUDIT_TABLE|EHR_DOCUMENTS_TABLE|EHR_DOCUMENTS_BUCKET|EHR_KMS_KEY_ARN|EHR_PHI_ENTRY_ALLOWED|EHR_HEALTHSCRIBE_REGION|EHR_HEALTHSCRIBE_BUCKET|EHR_HEALTHSCRIBE_KMS_KEY_ARN|EHR_HEALTHSCRIBE_DATA_ROLE_ARN|EHR_HEALTHSCRIBE_ORCHESTRATOR_ARN|EHR_FAX_BUCKET|EHR_FAX_REGION|EHR_NATIVE_TELEHEALTH_ENABLED|EHR_TELEHEALTH_REGION|NEXT_PUBLIC_AWS_REGION|NEXT_PUBLIC_COGNITO_USER_POOL_ID|NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID|NEXT_PUBLIC_COGNITO_CLIENT_ID|NEXT_PUBLIC_RLTH_AWS_FOUNDATION_READY)=' > .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
